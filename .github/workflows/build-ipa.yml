name: Build WDA IPA

  on:
    workflow_dispatch:

  jobs:
    build:
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v4
          with:
            ref: 'v4.16.16'

        - name: Build WDA runner
          run: |
            xcodebuild build-for-testing \
              -project WebDriverAgent.xcodeproj \
              -scheme WebDriverAgentRunner \
              -destination 'generic/platform=iOS' \
              -derivedDataPath DerivedData \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO

        - name: Package IPA
          run: |
            APP=$(find DerivedData/Build/Products/Debug-iphoneos -name "WebDriverAgentRunner-Runner.app" |   
  head -1)
            echo "App path: $APP"
            ls "$APP/PlugIns" && echo "PlugIns OK" || echo "WARNING: no PlugIns"
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r WebDriverAgentRunner.ipa Payload/

        - name: Upload IPA
          uses: actions/upload-artifact@v4
          with:
            name: WebDriverAgentRunner
            path: WebDriverAgentRunner.ipa
            retention-days: 30
