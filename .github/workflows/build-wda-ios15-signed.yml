# SIGNED build for real devices (fixes Sideloadly leaving .xctest unsigned).
#
# GitHub Secrets on your FORK:
#   BUILD_CERTIFICATE_BASE64
#   P12_PASSWORD
#   BUILD_PROVISION_PROFILE_BASE64  - wildcard App ID e.g. com.YOURNAME.*
#                                   (covers …WebDriverAgentRunner.xctrunner)
#   KEYCHAIN_PASSWORD
#   APPLE_TEAM_ID

name: Build WDA iOS15 SIGNED IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install signing certificate + profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_PLIST=$(mktemp)
          security cms -D -i $PP_PATH > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "Installed profile: $PROFILE_NAME ($PROFILE_UUID)"
          /usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$PROFILE_PLIST"

      - name: Disable signing on WebDriverAgentLib
        run: |
          set -euo pipefail
          # Static lib cannot take a provisioning profile; force it off in pbxproj.
          python3 <<'PY'
          from pathlib import Path
          path = Path("WebDriverAgent.xcodeproj/project.pbxproj")
          text = path.read_text()
          # Ensure every build-settings block that is for the lib target gets CODE_SIGNING_ALLOWED=NO.
          # Safer blunt approach: after every "buildSettings = {" insert the keys if missing near
          # PRODUCT_NAME = WebDriverAgentLib occurrences is hard; instead inject globally for
          # Debug/Release of the lib via known marker.
          needle = "PRODUCT_NAME = WebDriverAgentLib;"
          if needle not in text:
              raise SystemExit("WebDriverAgentLib PRODUCT_NAME not found")
          # Insert CODE_SIGNING_ALLOWED = NO before each PRODUCT_NAME = WebDriverAgentLib;
          insert = "CODE_SIGNING_ALLOWED = NO;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";\n\t\t\t\t"
          out = text.replace(needle, insert + needle)
          path.write_text(out)
          print("Patched WebDriverAgentLib signing off")
          PY

      - name: Build signed WebDriverAgentRunner
        run: |
          set -euo pipefail
          DERIVED="$PWD/wda_derived"
          BUNDLE_ID="${WDA_BUNDLE_ID:-com.rossgilchrist.WebDriverAgentRunner}"
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          echo "BUNDLE_ID=$BUNDLE_ID (app will be ${BUNDLE_ID}.xctrunner)"
          echo "TEAM=$TEAM_ID PROFILE=$PROFILE_NAME ($PROFILE_UUID)"
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            -configuration Debug \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find wda_derived/Build/Products -type d -name 'WebDriverAgentRunner-Runner.app' | head -n 1)
          echo "App: $APP"
          ls -la "$APP/PlugIns" || true
          ls -la "$APP/Frameworks" || true
          codesign -dv --verbose=4 "$APP/PlugIns/WebDriverAgentRunner.xctest" || true
          mkdir Payload && cp -R "$APP" Payload/
          zip -qr WebDriverAgent-iOS15-SIGNED.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-iOS15-SIGNED
          path: WebDriverAgent-iOS15-SIGNED.ipa
