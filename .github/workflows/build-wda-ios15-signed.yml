# SIGNED WDA for real devices.
# Builds unsigned (avoids Xcode profile matching), then codesigns the Runner.app
# including nested WebDriverAgentRunner.xctest (Sideloadly often skips that).
#
# Secrets: BUILD_CERTIFICATE_BASE64, P12_PASSWORD,
#          BUILD_PROVISION_PROFILE_BASE64 (wildcard com.YOURNAME.*),
#          KEYCHAIN_PASSWORD, APPLE_TEAM_ID

name: Build WDA iOS15 SIGNED IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install signing certificate + profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          cp "$PP_PATH" "$RUNNER_TEMP/wda.mobileprovision"
          echo "PP_PATH=$RUNNER_TEMP/wda.mobileprovision" >> $GITHUB_ENV
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build WebDriverAgentRunner (unsigned)
        run: |
          set -euo pipefail
          DERIVED="$PWD/wda_derived"
          BUNDLE_ID="${WDA_BUNDLE_ID:-com.rossgilchrist.WebDriverAgentRunner}"
          echo "PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID"
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            -configuration Debug \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Codesign app + nested xctest
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          APP=$(find wda_derived/Build/Products -type d -name 'WebDriverAgentRunner-Runner.app' | head -n 1)
          echo "App: $APP"
          test -n "$APP"
          XCTEST="$APP/PlugIns/WebDriverAgentRunner.xctest"
          test -d "$XCTEST"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Apple Development/{print $2; exit}')
          echo "Identity: $IDENTITY"
          test -n "$IDENTITY"

          # Entitlements from the development profile, with app id for the Runner.
          PROFILE_PLIST=$(mktemp)
          ENTITLEMENTS=$(mktemp)
          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$PROFILE_PLIST" > "$ENTITLEMENTS"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "Runner CFBundleIdentifier=$BUNDLE_ID"
          /usr/libexec/PlistBuddy -c "Set :application-identifier ${APPLE_TEAM_ID}.${BUNDLE_ID}" "$ENTITLEMENTS" \
            || /usr/libexec/PlistBuddy -c "Add :application-identifier string ${APPLE_TEAM_ID}.${BUNDLE_ID}" "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c "Set :com.apple.developer.team-identifier ${APPLE_TEAM_ID}" "$ENTITLEMENTS" \
            || /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string ${APPLE_TEAM_ID}" "$ENTITLEMENTS"
          echo "Entitlements:"
          cat "$ENTITLEMENTS"

          cp "$PP_PATH" "$APP/embedded.mobileprovision"

          # Sign deepest first.
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -name '*.framework' -maxdepth 1 | while read -r fw; do
              echo "codesign framework $fw"
              codesign --force --sign "$IDENTITY" --timestamp=none --generate-entitlement-der "$fw" || \
              codesign --force --sign "$IDENTITY" --timestamp=none "$fw"
            done
          fi
          if [ -d "$XCTEST/Frameworks" ]; then
            find "$XCTEST/Frameworks" -name '*.framework' -maxdepth 1 | while read -r fw; do
              echo "codesign xctest framework $fw"
              codesign --force --sign "$IDENTITY" --timestamp=none --generate-entitlement-der "$fw" || \
              codesign --force --sign "$IDENTITY" --timestamp=none "$fw"
            done
          fi

          echo "codesign xctest"
          codesign --force --sign "$IDENTITY" --entitlements "$ENTITLEMENTS" --timestamp=none --generate-entitlement-der "$XCTEST" || \
          codesign --force --sign "$IDENTITY" --entitlements "$ENTITLEMENTS" --timestamp=none "$XCTEST"

          echo "codesign app"
          codesign --force --sign "$IDENTITY" --entitlements "$ENTITLEMENTS" --timestamp=none --generate-entitlement-der "$APP" || \
          codesign --force --sign "$IDENTITY" --entitlements "$ENTITLEMENTS" --timestamp=none "$APP"

          echo "Verify:"
          codesign -dv --verbose=4 "$XCTEST"
          codesign -dv --verbose=4 "$APP"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find wda_derived/Build/Products -type d -name 'WebDriverAgentRunner-Runner.app' | head -n 1)
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr WebDriverAgent-iOS15-SIGNED.ipa Payload
          ls -lh WebDriverAgent-iOS15-SIGNED.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-iOS15-SIGNED
          path: WebDriverAgent-iOS15-SIGNED.ipa
