# SIGNED build for real devices (fixes Sideloadly leaving .xctest unsigned).
#
# GitHub Secrets on your FORK:
#   BUILD_CERTIFICATE_BASE64
#   P12_PASSWORD
#   BUILD_PROVISION_PROFILE_BASE64  - profile for App ID:
#       com.YOURNAME.WebDriverAgentRunner.xctrunner
#     (or a wildcard com.YOURNAME.*) — NOT the bare …WebDriverAgentRunner id
#   KEYCHAIN_PASSWORD
#   APPLE_TEAM_ID
#
# Why .xctrunner: Xcode packages UI-test runners as PRODUCT_BUNDLE_IDENTIFIER + ".xctrunner".

name: Build WDA iOS15 SIGNED IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install signing certificate + profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID"
          security cms -D -i $PP_PATH | grep -A2 application-identifier || true

      - name: Build signed WebDriverAgentRunner
        run: |
          set -euo pipefail
          DERIVED="$PWD/wda_derived"
          BUNDLE_ID="${WDA_BUNDLE_ID:-com.rossgilchrist.WebDriverAgentRunner}"
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          echo "Using PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID (runner app will be ${BUNDLE_ID}.xctrunner)"
          echo "Using DEVELOPMENT_TEAM=$TEAM_ID"
          # Do NOT pass PROVISIONING_PROFILE globally — WebDriverAgentLib rejects it.
          # Automatic + team + installed profile lets Xcode match the .xctrunner App ID.
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            -configuration Debug \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Development" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find wda_derived/Build/Products -type d -name 'WebDriverAgentRunner-Runner.app' | head -n 1)
          echo "App: $APP"
          ls -la "$APP/PlugIns" || true
          ls -la "$APP/Frameworks" || true
          codesign -dv --verbose=4 "$APP/PlugIns/WebDriverAgentRunner.xctest" || true
          mkdir Payload && cp -R "$APP" Payload/
          zip -qr WebDriverAgent-iOS15-SIGNED.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-iOS15-SIGNED
          path: WebDriverAgent-iOS15-SIGNED.ipa
