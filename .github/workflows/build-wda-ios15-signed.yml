# Optional: SIGNED build for real devices (fixes Sideloadly leaving .xctest unsigned).
#
# XCTest 103 with syslog:
#   "PlugIns/WebDriverAgentRunner.xctest/... completely unsigned? Code has to be at least ad-hoc signed."
# means the OUTER app was signed (Sideloadly) but the NESTED .xctest was not.
#
# Fix: sign the whole bundle in CI with your Apple Developer cert, then Sideloadly
# can install an already-valid IPA (or install via go-ios).
#
# GitHub Secrets required on your FORK:
#   BUILD_CERTIFICATE_BASE64  - base64 of your .p12
#   P12_PASSWORD              - password for the .p12
#   BUILD_PROVISION_PROFILE_BASE64 - base64 of .mobileprovision (includes iPhone UDID)
#   KEYCHAIN_PASSWORD         - any random password for the temp keychain
#
# Create the provisioning profile at developer.apple.com for App ID matching
# the bundle id you set below (default keeps com.facebook... only if your profile allows it;
# better: use com.YOURNAME.WebDriverAgentRunner and change PRODUCT_BUNDLE_IDENTIFIER).

name: Build WDA iOS15 SIGNED IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install signing certificate + profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Build signed WebDriverAgentRunner
        run: |
          set -euo pipefail
          DERIVED="$PWD/wda_derived"
          # Prefer your own bundle id if the facebook.* App ID is not in your profile.
          BUNDLE_ID="${WDA_BUNDLE_ID:-com.rossgilchrist.WebDriverAgentRunner}"
          echo "Using PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID"
          echo "Using DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}"
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            -configuration Debug \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find wda_derived/Build/Products -type d -name 'WebDriverAgentRunner-Runner.app' | head -n 1)
          echo "App: $APP"
          ls -la "$APP/PlugIns" || true
          ls -la "$APP/Frameworks" || true
          # Verify nested binary is signed
          codesign -dv --verbose=4 "$APP/PlugIns/WebDriverAgentRunner.xctest" || true
          mkdir Payload && cp -R "$APP" Payload/
          zip -qr WebDriverAgent-iOS15-SIGNED.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-iOS15-SIGNED
          path: WebDriverAgent-iOS15-SIGNED.ipa
